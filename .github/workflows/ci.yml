name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  # Lets you re-run the exact same checks from the Actions tab.
  workflow_dispatch:

# A newer push to the same ref cancels the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  guard:
    name: Guard the Vercel build contract
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No install: this scans source text and self-tests the rules, so it runs in
      # seconds. When it fails, the expensive build job is skipped entirely, and
      # the failure lands on the commit that introduced it rather than minutes in.
      - name: Source scan and guard selftest
        run: npm run preflight

  verify:
    name: Typecheck, lint & build
    runs-on: ubuntu-latest

    env:
      # Reproduces the production build target. `NEXT_TELEMETRY_DISABLED` keeps
      # CI logs clean.
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SITE_URL: https://www.aglobalcare.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` installs strictly from package-lock.json, so CI resolves the
      # same dependency tree as Vercel. Never use `npm install` here: it can
      # silently resolve newer ranges, which is exactly how a green local build
      # turns into a red deploy.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Vercel runs this on Linux; so do we. The `url()` failure below is
      # platform-specific — it passes on Windows and fails here — which is exactly
      # why it must be reproduced on a Linux runner.
      - name: Build
        run: npm run build

      # Authoritative check: scan the CSS the build actually produced. The rules
      # and their fixtures live in scripts/check-css-urls.mjs so that CI, local
      # verification and the guard's own selftest can never drift apart.
      #
      # Background: a Tailwind arbitrary value that compiles to `url(/asset.svg)`
      # makes webpack's css-loader treat the path as a module request, failing the
      # Linux build with `Cannot find module './&'`. Tailwind v4 also scans raw
      # source text — including comments and markdown — so writing the offending
      # utility in a comment that warns about it regenerates the bug.
      - name: Guard the compiled CSS
        run: npm run guard

      # The export must actually contain the pages and assets Vercel will serve.
      - name: Check export output
        run: |
          set -euo pipefail
          test -f out/index.html || { echo "::error::out/index.html is missing"; exit 1; }
          test -f out/robots.txt || { echo "::error::out/robots.txt is missing"; exit 1; }
          test -f out/sitemap.xml || { echo "::error::out/sitemap.xml is missing"; exit 1; }
          test -f out/logo.png || { echo "::error::out/logo.png is missing"; exit 1; }
          test -d out/partners || { echo "::error::out/partners is missing"; exit 1; }
          test -d out/team || { echo "::error::out/team is missing"; exit 1; }
          echo "Export OK: $(find out -type f | wc -l) files."
